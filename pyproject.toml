[project]
name = "aims"
version = "1.0.0a3"
authors = [
    {name = "Pavel Vaschenko", email="vaschenko@vmk.ru"},
]
maintainers = [
    {name = "Pavel Vaschenko", email="vaschenko@vmk.ru"},
]
readme = "README.md"
license = {text = "MIT License"}
dependencies = [
    "setuptools>=75.6.0",
    "spectrumapp>=1.0.2",
    "watchdog==4.0.1",
]
requires-python = ">=3.12"

[dependency-groups]
linting = [
    "flake8",
    "flake8-commas",
    "flake8-import-order",
    "flake8-bugbear",
    "flake8-builtins",
    "pep8-naming",
]
testing = [
    "faker>=33.3.1",
    "pytest",
    "pytest-cov",
    "pytest-flake8",
    "pytest-mock>=3.14.0",
    "pytest-qt",
]
installation = [
    "pyinstaller>=6.0",
]
dev = [
    {include-group = "linting"},
    {include-group = "testing"},
    {include-group = "installation"},
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
spectrumapp = { git = "https://github.com/Exinker/spectrumapp"}
